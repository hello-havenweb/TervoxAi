<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TERVOX AI</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages and static web hosts
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      l.replace(redirectUrl);
    </script>
  </head>
  <body style="background:#050B16; color:#EAF6FF; font-family:sans-serif; text-align:center; padding-top:20vh;">
    <h2>Redirecting to TERVOX AI...</h2>
  </body>
</html>
